# Save at .github/workflows/sync-picks.yml — replaces the existing file.
# Also add enrich.py at the repo root.
#
# Needs a second repo secret, CFBD_API_KEY. Get a free key at
# https://collegefootballdata.com/key and add it under
# Settings > Secrets and variables > Actions.
#
# Downloads the sheet, then fills in any blank result / margin / opponent by
# looking up the finished game. Anything already typed in the sheet is left
# alone. If a game cannot be matched with confidence the row stays blank.

name: Sync picks

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would be filled without committing'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check the arithmetic before trusting it
        run: python3 enrich.py --self-test

      - name: Download the sheet
        env:
          URL: ${{ secrets.SHEET_CSV_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "SHEET_CSV_URL secret is not set."
            exit 1
          fi
          curl -sSL --fail --retry 3 --max-time 60 "$URL" -o new.csv

      - name: Check it before trusting it
        run: |
          if head -c 200 new.csv | grep -qi "html"; then
            echo "Got a web page, not CSV. Is the sheet still published?"
            exit 1
          fi
          rows=$(grep -c "^[0-9]" new.csv || true)
          echo "Data rows found: $rows"
          if [ "$rows" -lt 300 ]; then
            echo "Too few rows. Keeping the current file."
            exit 1
          fi
          mv new.csv picks.csv

      - name: Fill in finished games
        continue-on-error: true          # a lookup failure must never lose the picks
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 enrich.py picks.csv --dry-run
          else
            python3 enrich.py picks.csv
          fi

      - name: Commit if changed
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name picks-bot
          git config user.email picks-bot@users.noreply.github.com
          git add picks.csv
          if git diff --staged --quiet; then
            echo "No change since last sync."
          else
            git commit -m "Sync picks from sheet"
            git push
          fi
