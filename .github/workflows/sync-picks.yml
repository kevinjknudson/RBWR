# Save this at .github/workflows/sync-picks.yml in your repo. # # One-time setup: # 1. In the sheet: File > Share > Publish to web > pick the "Site Data" tab, # format "Comma-separated values (.csv)" > Publish. Copy the URL. # 2. In the repo: Settings > Secrets and variables > Actions > New repository # secret. Name it SHEET_CSV_URL and paste that URL as the value. # # After that this runs on its own. The sanity checks below mean a bad publish # or a Google outage leaves the last good picks.csv in place rather than # wiping the site. name: Sync picks from Google Sheet on: schedule: # Every 30 minutes on Saturdays and Sundays, hourly otherwise (UTC). - cron: "*/30 * * * 6,0" - cron: "23 * * * 1-5" workflow_dispatch: {} permissions: contents: write concurrency: group: sync-picks cancel-in-progress: true jobs: sync: runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 - name: Download the published sheet env: SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }} run: | if [ -z "$SHEET_CSV_URL" ]; then echo "::error::SHEET_CSV_URL secret is not set. See the header of this file." exit 1 fi curl -sSL --fail --retry 3 --retry-delay 5 --max-time 60 \ "$SHEET_CSV_URL" -o incoming.csv - name: Check it before trusting it run: | set -e # Must not be Google's sign-in or error page. if head -c 200 incoming.csv | grep -qi "<!DOCTYPE\|
